[project]
name = "fondeos-sim"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "streamlit>=1.66.1",
]

[project.scripts]
fondeos-sim = "fondeos_sim:main"
fondeos-dashboard = "fondeos_sim.cli:dashboard"
fondeos-precalcular = "fondeos_sim.recommended:precompute"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
