# Dates above are the "Written by" dates shown on Help Center articles (Intercom); no separate "last updated" field.
# Common to ALL plans (from MLL article): "The Maximum Loss Limit (MLL) is EOD (end of day) trailing on all of our accounts";
# "stops trailing at the account starting balance on all of our accounts"; "If you break MLL at any point, floating equity
# or closed balance of account, your account will be liquidated." => eod_trailing, lock at starting balance, realtime breach.
# Qualified accounts: "Qualified Traders do not pay a monthly subscription." Payout split 90% flat from first payout.
# Payout cadence: up to 4 payouts/month; 5 winning days of >= $200 between requests (Zero/Standard/Advanced).

plans:
  - plan: Standard
    sizes:
      50K:
        eval:
          price_usd: 129
          price_notes: "Monthly subscription until pass. Coupon codes circulate on aggregators (10-20% off, unverified); DontPayFull (Jul 2026) mentioned a $79/mo 50K promo."
          billing: monthly
          reset_fee_usd: 109
          activation_fee_usd: 0          # "No Activation Fee"
          profit_target_usd: 3000
          mll:
            amount_usd: 2000
            type: eod_trailing
            lock_balance_usd: 50000      # floor stops at starting balance (reached when EOD balance >= 52,000)
            breach: realtime
          dll: {amount_usd: null, kind: null}   # "NONE on Evaluation!"
          consistency_pct: 50           # best day must not exceed 50% of net profit (recommend best day <= $1,500); not passing until satisfied, not a breach
          min_trading_days: 2
          max_days: null
          max_contracts: "5 mini / 50 micro"
        funded:
          mll: {amount_usd: 2000, type: eod_trailing, lock_balance_usd: 50000, breach: realtime}
          mll_after_payout: "MLL does NOT move on payout: 'If MLL was at $49,200 before payout, it will be after as well.' Withdrawals reduce balance toward the unchanged floor (only 50% of profit withdrawable keeps a cushion)."
          dll: {amount_usd: 1000, kind: pause}   # Daily Loss Guard, 'soft breach': flatten + locked until next trading day 6PM ET; counts unrealized
          consistency_pct: 40           # biggest day / net profit since last request; >= 40% blocks payout button (not a breach); resets each request
          payout:
            cycle_requirement: "5 winning days (non-consecutive) of >= $200 each since last request + 40% consistency"
            min_profit_to_request_usd: 1000   # derived: min payout $500 and max 50% of profit
            min_payout_usd: 500
            max_payout_per_cycle_usd: 3000    # flat, not escalating by payout number
            max_pct_of_profit: 50
            buffer_usd: null
            split_pct: 90
            frequency: "up to 4 per month, whenever 5 qualifying winning days accrue; processed within 48 business hours (third-party)"
          payouts_before_live: null    # discretionary; e.g. "Five performance fees on a single Qualified Account" can trigger review/call-up
          lifetime_payout_cap_usd: null
          scaling_plan: "By profit: <$1,500 -> 2 mini/20 micro; $1,500-2,000 -> 3/30; >= $2,000 -> 5/50"
          inactivity_days: 10          # trade at least once every 10 trading days (platform archiving) — applies to eval and qualified
        account_limits:
          max_funded_accounts: 5       # Standard Qualified: 5 (3 for Standard accounts prior to 2026-07-27); if user has any active Advanced Qualified, total limited to 3
          max_eval_accounts: null
        strategy_restrictions:
          max_loss_per_trade: null     # no numeric per-trade limit, but see 'All or Nothing' clause below
          min_rr_or_profit_rules: null
          min_hold_time / microscalping: "Microscalping = 'trades less than 10 ticks AND less than 2 minutes'; 'There is no must hold past X minutes rule' — violation only if it forms 'a clear pattern in the trader's profit'."
          news_trading: "Eval: no restrictions. Qualified (Standard/Zero/Direct): 'no orders may be executed within 2 minutes before or 2 minutes after high impact news events' (ForexFactory red folder, USD for ES/NQ/GC/CL); speeches: 4-minute window around listed start. Holding through news allowed. 1st violation: profits in window voided + payout denied (warning); subsequent: account breach."
          hedging_stacking: "'Account Rolling' / 'All or Nothing': 'taking max leverage positions with no plan, no stop loss'; traders who hit max loss and buy new accounts to repeat the process fall under it. 'Using maximum leverage on a single position and using DLL as a stop loss will not be tolerated.' ACCOUNT STACKING: 'excessive Evaluations and storing multiple passed accounts' (to roll into a Qualified Account after a withdrawal or max loss) prohibited. CROSS-ACCOUNT HEDGING: 'going short on one account, and long on the other is strictly prohibited at Evaluation and Qualified Phase' (also long NQ / short MNQ in same account). GROUP TRADING: 'Collaborating with others to execute identical or opposite strategies across unconnected accounts is prohibited.'"
          copy_trading: "allowed: 'Copy trading in general is permitted as long as it is a single user executing the trades.' Automated, group and reverse trading 'strictly prohibited'."
          other:
            - "'The use of AI, bots, and other automated trading mechanisms is strictly prohibited across all account types'; HFT (>100 trades/day) restricted."
            - "'Initiating trades to profit from isolated fills in gapped or illiquid markets is not allowed.'"
            - "Positions must be closed by 4:10/4:20 PM ET; no overnight holds (third-party; not verified on Help Center)."
      100K:
        eval: {price_usd: 239, billing: monthly, reset_fee_usd: 199, profit_target_usd: 6000, mll: {amount_usd: 3000, type: eod_trailing, lock_balance_usd: 100000, breach: realtime}, consistency_pct: 50, max_contracts: "10 mini / 100 micro"}
        funded: {dll: {amount_usd: 2000, kind: pause}, consistency_pct: 40, payout: {min_payout_usd: 500, max_payout_per_cycle_usd: 4000, max_pct_of_profit: 50, split_pct: 90}, scaling_plan: "<1.5K:3, 1.5-2K:4, 2-3K:5, >=3K:10 minis"}
      150K:
        eval: {price_usd: 349, billing: monthly, reset_fee_usd: 289, profit_target_usd: 9000, mll: {amount_usd: 4500, type: eod_trailing, lock_balance_usd: 150000, breach: realtime}, consistency_pct: 50, max_contracts: "15 mini / 150 micro"}
        funded: {dll: {amount_usd: 3000, kind: pause}, consistency_pct: 40, payout: {min_payout_usd: 500, max_payout_per_cycle_usd: 5000, max_pct_of_profit: 50, split_pct: 90}, scaling_plan: "<1.5K:3, 1.5-2K:4, 2-3K:5, 3-4.5K:10, >=4.5K:15 minis"}
    notes:
      - "Qualified Account reset (like a reactivation): 50K $599, 100K $799, 150K $999; max 2 per account, only if account never reached a payout request, within 7 days of breach."
      - "Homepage lists a monthly 'price' for Qualified accounts too, but the Monthly Subscription article states 'Qualified Traders do not pay a monthly subscription' — treated as no fee."
      - "Third-party (tradetanto/quantvps) claims Standard payouts are 'every 14 days'; official Payout Policy (2026-07-27) says 5 winning days, up to 4/month. Official used."
      - "Qualified starting balance assumed = nominal (50,000) since MLL article says floor stops at starting balance on all accounts; not explicitly stated for Qualified."
      - "Path to live: all Qualified accounts close when called up; each Qualified account with >=1 payout converts to a live account starting at $0 with $2,000 EOD drawdown (50K), 2 minis until MLL reaches $0 then 4 minis; DLL 30% of account size; daily uncapped payouts. Choice: Live Program (80% split, sim profits forfeited) or Alpha Prime (60% split + 12-month salary from 50% of sim profit, max $75K). Losing live -> up to 3-month cool-down."
    unknowns:
      - "Exact profit split / payout processing fees per payout method (only 90% stated)."
      - "Whether Qualified accounts start at nominal balance (50,000) or $0 — inferred nominal."
      - "Position close time / overnight rule not confirmed on Help Center."
      - "Max Withdrawal Request article mentions 'Premium' accounts (apparently a legacy plan) without figures; no Premium plan currently sold — rules unknown."
      - "Evaluation account count limit (none listed), though 'excessive Evaluations' is flagged as stacking."

