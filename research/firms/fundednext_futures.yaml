        funded: {payout: {cycle_requirement: "5 days >= $200, >= $500 cycle profit", max_payout_per_cycle_usd: 2500, max_pct_of_profit: 50, split_pct: 95}}
      150K:
        eval: {price_usd: 490.99, price_notes: "coupon $259.99 (first 2) / $289.99", reset_fee_usd: 284.99, profit_target_usd: 8000, mll: {amount_usd: 4000, type: eod_trailing, lock_balance_usd: 150100, breach: realtime}, consistency_pct: 40, max_contracts: "8 mini / 80 micro"}
        funded: {payout: {cycle_requirement: "5 days >= $250, >= $500 cycle profit", max_payout_per_cycle_usd: 4000, max_pct_of_profit: 50, split_pct: 95}}
    notes:
      - "Reward share 95% per help center (2026-10-12) and Flex funded rules. Third-party reviews mention 80% base / 90-95% add-on — outdated; no Flex add-on listed in the official add-on article (only Rapid Pro DLL add-on)."
      - "Flex 50K MLL ($1,500) is smaller than most competitors; lock at $50,100 means trailing stops after EOD balance $51,600."
      - "Live cumulative deposit across Flex accounts cannot exceed $10,000 (Flex overview)."
      - "Article inconsistency: MLL reset after payout described both as 'lock point' and 'initial balance + $100' (same value, $50,100)."
    unknowns:
