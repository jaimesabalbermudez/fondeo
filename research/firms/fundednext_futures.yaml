          price_usd: 141.99
          price_notes: >-
            List $141.99; coupon price $74.99 for the first 2 purchases, $84.99 from the 3rd (help
            center 2026-10-13; marketing page shows $74.99, 'up to 47% off' code FNFLEX). Homepage FAQ
            lists $69.99 (conflict). Reset $82.99 (Challenge phase only, unlimited up to max allocation).
          billing: one_time
          reset_fee_usd: 82.99
          activation_fee_usd: 0
          profit_target_usd: 2500
          mll:
            amount_usd: 1500
            type: eod_trailing
            lock_balance_usd: 50100
            breach: realtime
          dll: {amount_usd: null, kind: null}
          consistency_pct: 40     # best day must stay < 40% of TARGET ($1,000); if exceeded, required profit = best day / 0.40 (target rises, no breach)
          min_trading_days: null  # not stated (consistency implies >= 3 days at target)
          max_days: null
          max_contracts: "3 mini / 30 micro"
        funded:
          mll: {amount_usd: 1500, type: eod_trailing, lock_balance_usd: 50100, breach: realtime}
          mll_after_payout: "'Your first withdrawal resets the MLL to the lock point for your size' ($50,100 = initial balance + $100); stays there."
          dll: {amount_usd: null, kind: null}
          consistency_pct: null   # "there is no Consistency Rule on the Flex FundedNext Account"
          payout:
            cycle_requirement: "5 Benchmark Days with >= $200 profit each; >= $500 profit in current cycle"
            min_profit_to_request_usd: 500
            min_payout_usd: 250
            max_payout_per_cycle_usd: 1500
            max_pct_of_profit: 50
            buffer_usd: null
            split_pct: 95
            frequency: "per cycle after 5 Benchmark Days; request at end of day (trading that day removes the wallet-transfer option)"
          payouts_before_live: "Account CONCLUDES (closes) after the 5th Performance Reward. Live review after 15 rewards across profile (Road to Live 2026-10-24) vs '5 Performance Reward Cycles from a single account' (Flex overview 2026-10-14) - conflict"
          lifetime_payout_cap_usd: 7500   # derived: 5 payouts x $1,500 cap (gross, before 95% split)
          scaling_plan: "None (contracts fixed)"
          inactivity_days: 30
        account_limits:
          max_funded_accounts: 5
          max_eval_accounts: "unlimited purchases; $750K combined challenge allocation"
        strategy_restrictions: "see common_rules.strategy_restrictions"
