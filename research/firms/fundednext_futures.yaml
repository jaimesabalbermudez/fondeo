common_rules:
  billing: one_time            # "one-time fee, no subscription" (fundednext.com/futures); no activation fee
  activation_fee_usd: 0
  mll_mechanics: >-
    Trailing EOD: "It updates once per day at the end of the trading day (05:00 PM CT) — not in real
    time", trailing highest EOD balance, but "If your floating loss reaches the MLL during a live
    trade, your account is breached instantly." Hard breach (permanent).
  dll_mechanics: >-
    Where present: soft breach, "trading is disabled for the rest of the day"; checked intraday on an
    equity floor (floating losses count).
  microscalping: >-
    Trades closed within 10 s count only if profitable, as % of cycle profit. 30% -> warning.
    >=40%: Challenge -> progress put on hold until <40%; Funded -> that micro-scalping profit is
    deducted in full for the cycle. Never a breach by itself.
  inactivity: "Challenge & FundedNext accounts: 30 consecutive calendar days without a trade -> breached/deactivated; Direct: 7 days."
  contracts: "Fixed at creation, do not scale with profit; 1:10 mini/micro; excess-contract profit deducted, losses count."
  account_limits:
    max_funded_accounts: 5       # active at once, per user AND per household; max 10 FundedNext accounts issued per calendar month
    max_eval_accounts: "No monthly purchase cap, but max $750,000 combined Challenge allocation at any one time"
  live_transition: >-
    Road to Live (2026-10-24): new traders need 15 Performance Rewards across their whole profile to
    enter the live review pool (not guaranteed). At transition all Challenge accounts are closed
    without refund; FundedNext accounts with >=1 withdrawal convert to live (max 5); those with 0
    payouts are closed and refunded. Live 50K starts with $2,000 real balance, MLL trails from $0 and
    locks on payout request or when profit = starting balance; floor $1,000 below start with 'MLL Lock
    Benefit'; split 100% of first $5,000 cumulative, then 90/10; daily withdrawals min $100.
  strategy_restrictions:
    max_loss_per_trade: null     # no numeric per-trade cap found
    min_rr_or_profit_rules: null
    min_hold_time / microscalping: "see common_rules.microscalping (10 s rule, 30%/40% thresholds)"
    news_trading: allowed        # not prohibited; only 'Gapped or Illiquid Market Trading' and the 2% CME price-limit proximity rule are prohibited
    hedging_stacking: >-
      Prohibited 'Reverse Hedging and Coordinated Hedging' — "It can be done across the trader's own
      accounts or within a single account." Example: "A trader opens a buy on NQ in Account A and a
      sell on MNQ in Account B, both under their control." Also 'Hedging with Correlated Instruments'.
      'Account Rolling' prohibited: "multiple Challenge Accounts are purchased with the intention of
      quickly progressing to FundedNext Accounts ... It resembles gambling more than trading, as
      success depends on sheer luck rather than a structured strategy." Consequence: "restrictions
      on purchasing new accounts or adjustments to the lifetime allocation limit."
    copy_trading: "allowed between own accounts (also with other firms if same exact name): 'Traders can freely copy trades between their own FundedNext Accounts.' Copying others, signals and group trading prohibited."
    other:
      - "'Account Flipping and Inconsistent Contract Execution' prohibited: 'using high margin to rapidly grow or blow up accounts through reckless, oversized positions'; example given: a trader who 'places an all-in trade, risking the entire account balance on one position.' General clause: prohibited practices 'will result in account suspension and disqualification from further participation'. No numeric threshold given -> DIRECT RISK for an 'all MLL in one trade' strategy."
      - "Also prohibited: tick scalping, latency arbitrage, grid trading, bracket strategies, spoofing/layering, wash trading, multi-order spam, slow-feed abuse, simulated-execution exploitation, trading within 2% of CME price limits."
      - "DCA allowed if planned; 'averaging down blindly in hopes of a reversal is considered poor risk management and should be avoided' (no numeric cap)."

