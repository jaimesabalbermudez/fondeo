notes:
  - "All help-center pages show only relative dates ('Updated this week' / 'over a week ago') as seen 2026-10-24; R&C FAQ dated 2026-09-15. Several rules changed for accounts bought on/after 2025-09-12 and 2026-09-01; values above are for NEW purchases."
  - "Third-party reviews (traderspost, proptradingvibes) disagreed on Select Flex/Daily caps; official article values used."
  - "No official rule caps loss per trade or forbids risking the whole MLL in one trade; martingale explicitly allowed. Only risks: hedging/cross-account opposing positions, good-faith/KYT discretionary review of payouts."
unknowns:
  - "Exact calendar dates of help-center article revisions."
  - "Whether discretionary 'gambling' review exists in the Terms of Use (Terms not fetched; help center silent)."
