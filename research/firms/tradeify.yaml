common_rules:   # apply to all Tradeify plans unless overridden below
  billing: one_time            # "All plans are one-time purchases ... no recurring billing" (Pricing Reference)
  activation_fee_usd: 0        # "Growth, Select, and Lightning accounts have no activation fees." (Common FAQs)
  mll_mechanics: >-
    EOD trailing (follows highest end-of-day balance, updated at close) but enforced in real time on
    net liquidation value: "Hitting the floor intraday fails the account permanently, even if you
    recover before the close." On Sim Funded accounts the trailing floor locks at start+$100 once EOD
    balance reaches the lock trigger OR immediately when a payout is requested, whichever first.
  dll_mechanics: >-
    Soft breach: trading paused until next session (6:00 PM ET); "does NOT fail your account".
    Not a hard stop (losses can exceed it). Realized vs unrealized not specified in the article.
  trading_day: "6:00 PM - 5:00 PM ET; no overnight holding (positions auto-closed at cutoff, no penalty)."
  microscalping_funded: >-
    Funded only: to request a payout, >50% of trades AND >50% of profit must come from trades held
    >10 seconds. Failing it blocks the payout request; it does not fail the account.
  inactivity: "At least one trade per week (Mon-Fri) per account, eval and funded, or account may be closed after email warning."
  split_pct: 90               # all sim funded plans; Elite Live = 80/20
  live_transition: >-
    Elite Live eligibility after 3 payouts on one account OR 10 total payouts across all plans
    (minimum thresholds, not automatic). Transition is mandatory once selected. ALL sim funded and
    eval accounts close at transition; only funded accounts with >=1 payout move to Live; unpaid
    sim profit since last payout is lost. Elite Live starts at $0 balance, 80/20 split, daily payouts,
    50K Elite drawdown $2,000 EOD (locks at EOD balance $2,100).
  account_limits:
    max_funded_accounts: 5      # per individual and per household; V2 Select 300K funded sit on top (up to 8)
    max_eval_accounts: "Growth: no limit; Select: max 15 purchases per 30-day period; each Select eval resettable up to 10 times per 30 days"
    sim_and_live_simultaneous: false
    funded_activations_per_day: 5   # stated in Growth article
  strategy_restrictions:
    max_loss_per_trade: null    # no per-trade loss cap / no negative-P&L rule found in any official article
    min_rr_or_profit_rules: null
    min_hold_time / microscalping: "Funded only: >50% of trades and >50% of profit from trades held >10s, else payout blocked"
    news_trading: allowed       # "News trading is allowed with no restrictions"
    martingale: "allowed (Common FAQs: 'Be aware that martingale is high-risk - stay within your drawdown and daily loss limits.')"
    hedging_stacking: >-
      "Tradeify prohibits hedging." Opposing positions on same instrument or correlated products
      (same Product Group), including across accounts: "Holding a long position on one account and
      a short position on another account is a hedging violation." "A hedging violation results in
      every account involved being set to violation status" (possible profit forfeiture / ban). A
      10-second grace window exists to close an accidental opposing position. Risk & Compliance FAQ
      (2026-09-15) also prohibits "arrangements distributing activity across accounts to circumvent
      Tradeify's rules" and "circumventing household or individual limits". No explicit rule against
      same-direction multi-account stacking.
    copy_trading: allowed       # "Yes, as long as the positions are in the same direction. Copy trading is permitted." (own accounts); copying others / team trading prohibited
    other:
      - "Algos/bots allowed only if solely owned, not shared with other traders/firms, not HFT."
      - "Good-faith clause: no exploiting platform/price-display errors or feed delays."
      - "Payout requests reviewed; 'Submitting a payout request does not guarantee approval' (R&C FAQ). KYT review can withhold payouts."

plans:
  - plan: Select Flex   # Select Evaluation + 'Flex' (5-day) payout policy chosen after passing (permanent per account)
    sizes:
      50K:
        eval:
          price_usd: 165
          price_notes: >-
            Standard Select (40% consistency). With 50% Consistency Add-on: $205 (reset $135).
            5-account bundle -5% (25K/50K only), stacks with promo codes; Tradeify's own example uses a
            40% promo code. Promo codes do not apply to resets.
          billing: one_time
          reset_fee_usd: 109
          activation_fee_usd: 0
          profit_target_usd: 3000      # accounts bought before new dashboard keep $2,500 target
          mll:
            amount_usd: 2000
            type: eod_trailing
            lock_balance_usd: 50100    # Select eval article says floor locks at $50,100; see notes (conflict)
            breach: realtime
          dll: {amount_usd: null, kind: null}   # no DLL in Select eval
          consistency_pct: 40          # 50 with paid add-on; best day / total profit
          min_trading_days: 3          # 2 with 50% add-on
          max_days: null               # no time limit
          max_contracts: "4 mini / 40 micro"
        funded:
          mll: {amount_usd: 2000, type: eod_trailing, lock_balance_usd: 50100, breach: realtime}   # lock triggers at EOD balance $52,100 or on first payout request
          mll_after_payout: >-
            Requesting a payout immediately locks the floor at $50,100 (start + $100); it never rises
            again. Payout is deducted from balance, so the cushion after payout = balance - payout - 50,100.
          dll: {amount_usd: null, kind: null}
          consistency_pct: null        # "There is no consistency rule for Select accounts in funded mode."
          payout:
            cycle_requirement: "5 winning days with >= $150 net profit each; after first payout, net cycle profit must be positive"
            min_profit_to_request_usd: null
            min_payout_usd: 250
            max_payout_per_cycle_usd: 2500     # accounts bought on/after 2026-09-01; $3,000 before
            max_pct_of_profit: 50              # of total profit (balance - starting balance)
            buffer_usd: null                   # "Buffer: None", no minimum balance
            split_pct: 90
            frequency: "every 5 winning days; one open request at a time"
          payouts_before_live: "Elite Live eligibility after 3 payouts on one account or 10 total (discretionary, mandatory once selected)"
          lifetime_payout_cap_usd: null
          scaling_plan: "Starts 2 mini/20 micro; EOD profit >= $1,500 -> 3/30; >= $2,000 -> 4/40 (applies next day)"
          inactivity_days: 7           # >=1 trade per Mon-Fri week
        account_limits:
          max_funded_accounts: 5
          max_eval_accounts: "15 Select purchases per 30 days"
        strategy_restrictions: "see common_rules.strategy_restrictions"
      25K:
        eval: {price_usd: 109, reset_fee_usd: 75, profit_target_usd: 1500, mll: {amount_usd: 1000, type: eod_trailing, lock_balance_usd: 25100, breach: realtime}, consistency_pct: 40, min_trading_days: 3, max_contracts: "1 mini / 10 micro"}
        funded: {payout: {cycle_requirement: "5 winning days >= $100", max_payout_per_cycle_usd: 1250, max_pct_of_profit: 50, min_payout_usd: 250}, lock_trigger_eod_usd: 26100, scaling_plan: "1/10 -> 2/20 at +$1,500"}
      100K:
        eval: {price_usd: 265, reset_fee_usd: 169, profit_target_usd: 6000, mll: {amount_usd: 3000, type: eod_trailing, lock_balance_usd: 100100, breach: realtime}, consistency_pct: 40, min_trading_days: 3, max_contracts: "8 mini / 80 micro"}
        funded: {payout: {cycle_requirement: "5 winning days >= $200", max_payout_per_cycle_usd: 3500, max_pct_of_profit: 50, min_payout_usd: 250}, lock_trigger_eod_usd: 103100}
      150K:
        eval: {price_usd: 369, reset_fee_usd: 239, profit_target_usd: 9000, mll: {amount_usd: 4500, type: eod_trailing, lock_balance_usd: 150100, breach: realtime}, consistency_pct: 40, min_trading_days: 3, max_contracts: "12 mini / 120 micro"}
        funded: {payout: {cycle_requirement: "5 winning days >= $250", max_payout_per_cycle_usd: 4500, max_pct_of_profit: 50, min_payout_usd: 250}, lock_trigger_eod_usd: 154600}
    notes:
      - "Payout policy (Flex vs Daily) is chosen after passing Select and is permanent for that account."
      - "Caps for accounts bought before 2026-09-01: 25K $1,250 / 50K $3,000 / 100K $4,000 / 150K $5,000 (Select Flex payout article)."
      - "CONFLICT on eval lock: Select Evaluation article says 'floor locks at $50,100' once EOD balance exceeds drawdown+$100; 'Rules: Trailing Max Drawdowns' says 'Drawdown only locks on Sim Funded accounts.' Both undated ('Updated this week' / 'over a week ago', seen 2026-10-24). Practically irrelevant for 50K since target $3,000 > $2,100 trigger -> eval ends at 53,000 anyway, but floor would be 50,100 vs 51,000 near pass."
      - "Select 300K (limited release, V2 $349, no resets, KYC, max 3 lifetime purchases): Flex $750/winning day, 50% of profit, cap $10,000/payout."
      - "Implication for 'all-in' sim: after first payout floor is fixed at 50,100; with 50% cap, a 50K Flex with $2,000 profit pays $1,000 and is left with $900 cushion."
      - "Third-party (proptradingvibes) quoted a '$1,250 hard max' for Flex; contradicted by official article - ignored."
    unknowns:
      - "Whether 'max payout per cycle' ever increases by payout number for Select Flex (official article lists a single cap)."
      - "Whether DLL/MLL use realized+unrealized (MLL: net liquidation value, i.e. includes unrealized)."
      - "Exact lifetime payout cap per sim account (none stated)."

