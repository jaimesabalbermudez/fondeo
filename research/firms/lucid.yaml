        funded: {mll: {amount_usd: 3000, type: eod_trailing, lock_balance_usd: 100100}, lock_trigger_eod_usd: 103100, dll: {amount_usd: 1800, kind: pause}, consistency_pct: null, payout: {cycle_requirement: "5 days >= $200 + positive cycle profit", min_payout_usd: 500, max_payout_per_cycle_usd: 2500, max_pct_of_profit: 50, buffer_usd: 0, split_pct: 90}, payouts_before_live: 5, lifetime_payout_cap_usd: 12500, scaling_plan: "$0-999 -> 3 minis/30 micros; $1,000-1,999 -> 4/40; $2,000-2,999 -> 5/50; $3,000+ -> 6/60"}
      150K:
        eval: {price_usd: 323, price_dll_off_usd: 379, price_with_code_usd: {dll_on: 226.10, dll_off: 265.30}, reset_fee_usd: {dll_on: 225, dll_off: 265}, profit_target_usd: 9000, mll: {amount_usd: 4500, type: eod_trailing, lock_balance_usd: 150100, breach: realtime}, dll: {amount_usd: 2700, kind: pause}, consistency_pct: 40, max_contracts: "10 mini / 100 micros"}   # prices before 2026-10-18: $372 / $407
        funded: {mll: {amount_usd: 4500, type: eod_trailing, lock_balance_usd: 150100}, lock_trigger_eod_usd: 154600, dll: {amount_usd: 2700, kind: pause}, consistency_pct: null, payout: {cycle_requirement: "5 days >= $250 + positive cycle profit", min_payout_usd: 500, max_payout_per_cycle_usd: 3000, max_pct_of_profit: 50, buffer_usd: 0, split_pct: 90}, payouts_before_live: 5, lifetime_payout_cap_usd: 15000, scaling_plan: "$0-999 -> 4 minis/40 micros; $1,000-1,999 -> 5/50; $2,000-2,999 -> 6/60; $3,000-4,499 -> 8/80; $4,500+ -> 10/100"}
    notes:
      - "2026-10-29 update: ETFPROMO is now listed by eltraderfinanciado as a PERMANENT 30% code on Flex/Pro/Daily/Direct, all sizes (the 40%-on-DLL version expired 2026-10-23). Reset fee (third-party) ~= list price minus 30%, rounded down."
      - "Third-party DLL amounts for Flex DLL ON: 25K $600 / 50K $1,200 / 100K $1,800 / 150K $2,700 (same as Pro/Daily official tables). Official Flex articles only say 'Optional'."
      - "Flex customization (2026-10): DLL ON/OFF x consistency 40%/50% = 4 configurations, fixed at purchase. DLL ON = cheaper + On Demand (intraday) payouts."
      - "Other sizes (eval target / MLL / max size): 25K $1,250/$1,000/2 mini; 100K $6,000/$3,000/6 mini; 150K $9,000/$4,500/10 mini. Min winning-day profit 25K $100, 100K $200, 150K $250. Lock floors 25,100/100,100/150,100 at trail balances 26,100/103,100/154,600."
      - "Payout max wording conflict (same official article): text says 'request 50% of their account balance up to a maximum', table says '50% of Profit up to $2,000'. Interpreted as 50% of profit."
      - "Breach timing: official drawdown articles only say 'If your account balance reached the MLL, your account will be breached'. Third-party (proptradingvibes, 2026-10-12): 'EOD describes when the floor moves; it does not create an intraday recovery window'. One older third-party review claimed intraday dips are tolerated if recovered by close - treated as unreliable."
      - "Live (new structure, mod 2026-10-14): after payout 5 trader enters live review pool (discretionary). One live account per funded account with >=1 payout; live starts at $0 balance, $2,000 EOD drawdown (50K), locks at $100 once profit = drawdown; daily payouts; repeatable bonus $2,000 after +$4,000 and 20 trading days. Cash-out option = 50% of live starting balance at 90/10. All sim accounts closed when moved live."
      - "Legacy Flex (bought/reset <= 2026-02-27): live after 6th payout, move-to-live cap $8,000 per 50K account with escrow."
