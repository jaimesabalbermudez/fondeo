          billing: one_time
          reset_fee_usd: null
          activation_fee_usd: 0
          profit_target_usd: 3000
          mll:
            amount_usd: 2000
            type: eod_trailing
            lock_balance_usd: 50100   # locks when EOD balance exceeds $52,100
            breach: realtime
          dll: {amount_usd: 1200, kind: pause}   # only if DLL ON chosen at checkout (optional since 2026-10); soft breach
          consistency_pct: null     # none in eval ("Pass the evaluation in one trading day")
          min_trading_days: 1
          max_days: null
          max_contracts: "4 mini / 40 micros"
        funded:
          mll: {amount_usd: 2000, type: eod_trailing, lock_balance_usd: 50100, breach: realtime}
          mll_after_payout: "Not stated explicitly. Payout requires balance above buffer $52,100 (= trail balance), so the floor is already locked at $50,100 when any payout is taken; it remains static."
          dll: {amount_usd: 1200, kind: pause}   # if DLL ON: fixed $1,200 until EOD close above $52,100, then 'LucidScale DLL' = 60% of highest EOD profit (never decreases)
          consistency_pct: 40       # per payout cycle, resets after each payout (35% for accounts bought/reset before 2025-11-28)
          payout:
            cycle_requirement: "Profit since last payout >= $500 (50K) + largest day <= 40% of cycle profit + balance above buffer"
            min_profit_to_request_usd: 500
            min_payout_usd: 500
            max_payout_per_cycle_usd: [2000, 2500, 2500, 2500, 2500]   # payout 1 $2,000; payouts 2+ $2,500
            max_pct_of_profit: null   # limited by buffer instead: can only withdraw balance above $52,100
            buffer_usd: 2100          # buffer balance $52,100 = initial MLL + $100; cannot withdraw from buffer
            split_pct: 90             # accounts before 2025-11-28 3PM EST: 100% of first $10k
            frequency: "any day once criteria met; DLL ON -> On Demand intraday payouts"
          payouts_before_live: 5      # 'Payout 5 represents the maximum payout level' for Flex, Pro, Direct
          lifetime_payout_cap_usd: 12000   # implied: 2,000 + 4 x 2,500 (gross)
          scaling_plan: "None - full 4 mini / 40 micro from day one"
          inactivity_days: 30
        account_limits:
          max_funded_accounts: 5
          max_eval_accounts: 10
        strategy_restrictions:
          max_loss_per_trade: null
          min_rr_or_profit_rules: null
          "min_hold_time / microscalping": "Same firm-wide microscalping rule (>50% profits from trades <=5s) and HFT ban."
          news_trading: allowed
          hedging_stacking: "Same firm-wide hedging ban (incl. cross-account and correlated assets across accounts)."
          copy_trading: allowed
          other:
            - "40% payout-cycle consistency effectively limits how much one big day can count toward a payout."
    notes:
      - "Pro funded 'No simulated payout caps' marketing line conflicts with per-payout max table and 5-payout limit; per-payout max table is used."
      - "Example official min balances (50K): $52,600 for a $500 payout; $54,100 for $2,000 first payout; $54,600 for $2,500 payout 2+."
    unknowns:
      - "Official prices/reset fees."
      - "Explicit statement of MLL behaviour after payout."

