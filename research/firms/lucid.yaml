plans:
  - plan: Flex   # "LucidFlex"
    sizes:
      50K:
        eval:
          price_usd: 115            # list price, DLL ON + 40% consistency (base config). THIRD-PARTY (eltraderfinanciado, 2026-10-19)
          price_notes: "THIRD-PARTY prices (official site blocked). From 2026-10-18: 50K Flex DLL ON $115 (was $136), DLL OFF $165 (was $146); 50% consistency add-on +$7..$35 depending on size. Codes: ETFPROMO -40% DLL ON / -30% DLL OFF (expired 2026-10-23); VIBES -40% (affiliate). Codes of 30-50% are near-permanent."
          billing: one_time
          reset_fee_usd: null       # resets exist (purchased from dashboard) but amount not published officially
          activation_fee_usd: 0
          profit_target_usd: 3000
          mll:
            amount_usd: 2000
            type: eod_trailing
            lock_balance_usd: 50100 # floor locks at start+$100 once EOD balance exceeds Initial Trail Balance $52,100 (same table for eval and funded)
            breach: realtime        # see notes: official text "If your account balance reached the MLL, your account will be breached"; intraday touch assumed
          dll: {amount_usd: null, kind: pause}   # optional at checkout (DLL ON/OFF). Soft breach = locked out until next session. Amount for Flex not stated officially; third-party says $1,200 for 50K
          consistency_pct: 40       # 50 with paid add-on (with small built-in cushion, e.g. $1,560 on 50K)
          min_trading_days: null    # no explicit rule; 40% consistency implies >=3 days, 50% add-on >=2 days
          max_days: null            # "take as long as you need" (but 30-day inactivity deletion applies)
          max_contracts: "4 mini / 40 micros (no scaling in eval)"
        funded:
          mll: {amount_usd: 2000, type: eod_trailing, lock_balance_usd: 50100, breach: realtime}   # Initial Trail Balance $52,100 -> floor locks $50,100
          mll_after_payout: "On the first payout request the MLL jumps to the Locked MLL Balance ($50,100) and stays static, even if the balance had not reached $52,100 yet. There is no buffer, so after a payout the balance can sit very close to the floor."
          dll: {amount_usd: null, kind: pause}   # optional (same choice as eval); third-party: $1,200 on 50K
          consistency_pct: null
          payout:
            cycle_requirement: "5 separate days with >= $150 profit (50K) in the cycle + positive net profit (>= $1) in the cycle; both reset after each approved payout"
            min_profit_to_request_usd: 1        # only 'positive net profit in cycle'; effective floor is set by the $500 minimum request
            min_payout_usd: 500
            max_payout_per_cycle_usd: 2000      # flat, does NOT scale with payout number (25K $1,000 / 100K $2,500 / 150K $3,000)
            max_pct_of_profit: 50               # table: "50% of Profit up to $2,000"; text says "50% of their account balance" (see notes)
            buffer_usd: 0                       # "There is no buffer balance that must be maintained in LucidFlex funded accounts."
            split_pct: 90
            frequency: "any day once criteria met (no fixed window). DLL ON accounts: 'On Demand' intraday requests from that session's profit (trading paused rest of day after request). DLL OFF: end-of-day schedule."
          payouts_before_live: 5                # max 5 payouts per Flex account, then enters live review pool (legacy accounts bought <=2026-02-27: 6)
          lifetime_payout_cap_usd: 10000        # implied: 5 payouts x $2,000 max per 50K account (gross, before split); not stated as a cap
          scaling_plan: "Funded 50K, by simulated profit (updates end of session): $0-999 -> 2 minis/20 micros; $1,000-1,999 -> 3/30; $2,000+ -> 4/40. Payouts reduce profit and can drop the tier."
          inactivity_days: 30                   # no trade with >= $1 net P&L in 30 calendar days -> account deleted
        account_limits:
          max_funded_accounts: 5                # per household, all funded types combined
          max_eval_accounts: 10                 # evals + funded combined may not exceed 10
        strategy_restrictions:
          max_loss_per_trade: null              # no per-trade loss cap / negative P&L rule found
          min_rr_or_profit_rules: null
          "min_hold_time / microscalping": "Prohibited microscalping: flagged if >50% of profits come from trades held <=5 seconds (manual review, warning, then profit forfeiture). HFT prohibited."
          news_trading: allowed                 # allowed on Flex/Pro/Direct (NOT on LucidDaily)
          hedging_stacking: "\"Lucid Trading strictly prohibits all forms of hedging, including ... across multiple accounts held by the same user, between different users' accounts, between different firms\". Cannot be long/short same contract (mini vs micro) in separate accounts, nor 'different contracts in separate accounts with correlated assets. Example: You cannot go long ES in one account and short NQ in a separate account.' Penalty: accounts reset to prior day balance (drawdown not restored); repeat = breach + ban. Same-direction stacking across accounts is NOT prohibited."
          copy_trading: allowed                 # "Automated trading systems and trade copiers are permitted"
          other:
            - "Positions auto-closed 4:45 PM ET (not a breach); trading reopens 6:00 PM ET."
            - "Martingaling 'strongly discouraged' (not prohibited); DCA/scaling-in allowed; flipping for trading-day count allowed."
            - "Trade with Integrity: prohibits exploiting system errors, sim price discrepancies, 'tactics that do not reflect real-world trading conditions'."
            - "Circumventing the scaling plan (e.g. minis+micros) can lead to profit wiped for the day."
            - "Live: 'yolo' traders not eligible for bonus/escrow and may get longer cooldowns (live only)."
    notes:
      - "Flex customization (2026-10): DLL ON/OFF x consistency 40%/50% = 4 configurations, fixed at purchase. DLL ON = cheaper + On Demand (intraday) payouts."
      - "Other sizes (eval target / MLL / max size): 25K $1,250/$1,000/2 mini; 100K $6,000/$3,000/6 mini; 150K $9,000/$4,500/10 mini. Min winning-day profit 25K $100, 100K $200, 150K $250. Lock floors 25,100/100,100/150,100 at trail balances 26,100/103,100/154,600."
      - "Payout max wording conflict (same official article): text says 'request 50% of their account balance up to a maximum', table says '50% of Profit up to $2,000'. Interpreted as 50% of profit."
      - "Breach timing: official drawdown articles only say 'If your account balance reached the MLL, your account will be breached'. Third-party (proptradingvibes, 2026-10-12): 'EOD describes when the floor moves; it does not create an intraday recovery window'. One older third-party review claimed intraday dips are tolerated if recovered by close - treated as unreliable."
      - "Live (new structure, mod 2026-10-14): after payout 5 trader enters live review pool (discretionary). One live account per funded account with >=1 payout; live starts at $0 balance, $2,000 EOD drawdown (50K), locks at $100 once profit = drawdown; daily payouts; repeatable bonus $2,000 after +$4,000 and 20 trading days. Cash-out option = 50% of live starting balance at 90/10. All sim accounts closed when moved live."
      - "Legacy Flex (bought/reset <= 2026-02-27): live after 6th payout, move-to-live cap $8,000 per 50K account with escrow."
      - "Payout disbursement within 2 business days; funds deducted within minutes of approval. Requests are final."
      - "Commissions (sim): ES/NQ $1.75 per side, MES/MNQ $0.50 per side."
    unknowns:
      - "Official list prices and reset fees (lucidtrading.com blocked by Cloudflare; only third-party prices)."
      - "Official Flex DLL dollar amount when DLL ON (third-party: $1,200 on 50K, same as Pro/Daily)."
      - "Whether MLL breach is evaluated on unrealized intraday equity (assumed realtime; not explicitly stated)."
      - "No explicit lifetime payout cap beyond the 5-payout limit."

