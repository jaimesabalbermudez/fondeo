        funded:
          mll: {amount_usd: 2000, type: eod_trailing, lock_balance_usd: 0, breach: realtime}   # XFA balance starts at $0
          mll_after_payout: "Set to $0 permanently after any payout (same as Standard path)."
          dll: {amount_usd: null, kind: null}
