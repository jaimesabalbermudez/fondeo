        strategy_restrictions:
          max_loss_per_trade: null
          min_rr_or_profit_rules: null
          min_hold_time / microscalping: "same as Standard path"
          news_trading: "same as Standard path"
          hedging_stacking: "same account-stacking and cross-account-hedging prohibitions as Standard path (see above)"
          copy_trading: "allowed up to $750K buying power"
          other: []
      100K:
        funded: {payout: {max_payout_per_cycle_usd: 4000, max_pct_of_profit: 50, split_pct: 90}}
      150K:
        funded: {payout: {max_payout_per_cycle_usd: 6000, max_pct_of_profit: 50, split_pct: 90}}
    notes:
      - "XFA Parameters page (2026-08-05) lists the Consistency max payout as '50% of balance, up to $6,000' (150K figure); Payout Policy per-size table: 50K $3,000 / 100K $4,000 / 150K $6,000."
    unknowns: []

  - plan: "Optional Daily Loss Limit add-on (Responsible Trading option; applies to either payout path)"
    sizes:
      50K:
        eval:
          price_usd: 49
          price_notes: "DLL chosen at Combine checkout. Discount only on No Activation Fee path: $10 off (50K) -> $85/mo; Back2Funded $50 off. Limited-time offer since 2026-06-02 3:30 PM CT: DLL added at Combine checkout DOUBLES XFA payout caps after passing (not for DLL added at XFA activation/reactivation or pre-existing DLLs)."
          billing: monthly
          reset_fee_usd: 49
          activation_fee_usd: 149
          profit_target_usd: 3000
          mll: {amount_usd: 2000, type: eod_trailing, lock_balance_usd: 50000, breach: realtime}
          dll: {amount_usd: 1000, kind: pause}   # "not a rule violation — it's a forced break for the rest of that session"; positions flattened
          consistency_pct: 55
          min_trading_days: 2
          max_days: null
          max_contracts: "5 mini / 50 micro"
        funded:
          mll: {amount_usd: 2000, type: eod_trailing, lock_balance_usd: 0, breach: realtime}
          mll_after_payout: "Set to $0 permanently after any payout."
          dll: {amount_usd: 1000, kind: pause}   # purchase-set DLL is fixed and carries into the XFA
          consistency_pct: null                  # 40% if Consistency path
          payout:
            cycle_requirement: "Standard: 5 days >= $150; Consistency: 3 days + 40%"
            min_profit_to_request_usd: 250
            min_payout_usd: 125
            max_payout_per_cycle_usd: 4000   # 50K with DLL promo: Standard $4,000 / Consistency $6,000 (still limited to 50% of balance)
            max_pct_of_profit: 50
            buffer_usd: null
            split_pct: 90
            frequency: "same as chosen path"
          payouts_before_live: null
          lifetime_payout_cap_usd: null
          scaling_plan: "same as XFA"
          inactivity_days: 30
        account_limits:
          max_funded_accounts: 5
          max_eval_accounts: null
        strategy_restrictions:
          max_loss_per_trade: null
          min_rr_or_profit_rules: null
          min_hold_time / microscalping: "same as Standard path"
          news_trading: "same as Standard path"
          hedging_stacking: "same as Standard path"
          copy_trading: "allowed up to $750K buying power"
          other: []
      100K:
        eval: {dll: {amount_usd: 2000, kind: pause}}
        funded: {dll: {amount_usd: 2000, kind: pause}, payout: {max_payout_per_cycle_usd: 6000}}   # Consistency w/ DLL: 8000
      150K:
        eval: {dll: {amount_usd: 3000, kind: pause}}
        funded: {dll: {amount_usd: 3000, kind: pause}, payout: {max_payout_per_cycle_usd: 10000}}  # Consistency w/ DLL: 12000
