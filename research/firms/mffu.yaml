plans:
  - plan: Flex   # LEGACY - no longer sold (not in site product list on 2026-10-24); existing accounts still run under these rules
    sizes:
      50K:
        eval:
          price_usd: null           # not purchasable any more; last list price unknown
          price_notes: "Flex absent from myfundedfutures.com product catalogue (Builder, Rapid, Rapid EOD, Pro, Studio only). Help article for 50K Flex sits in 'Legacy Plans' collection but was edited 2026-10-21. Optional DLL add-on was sold 'at a reduced price'."
          billing: one_time         # all new purchases one-time since 2026-08-25 (legacy subscribers kept monthly)
          reset_fee_usd: null
          activation_fee_usd: 0
          profit_target_usd: 3000
          mll:
            amount_usd: 2000
            type: eod_trailing
            lock_balance_usd: 50100   # firm-wide: EOD trailing locks at start + $100 (trigger EOD balance $52,100)
            breach: realtime          # "open equity losses are taken into consideration ... if an open position dips your account balance below the minimum account balance, your evaluation attempt will fail"
          dll: {amount_usd: 1000, kind: pause}   # ONLY with optional DLL add-on; default none
          consistency_pct: 50
          min_trading_days: 2
          max_days: null
          max_contracts: "3 mini / 30 micros"   # current article; older version 5/50
        funded:
          mll: {amount_usd: 2000, type: eod_trailing, lock_balance_usd: 100, breach: realtime}   # sim funded starts at $0 balance; floor -$2,000, locks at +$100 (= 50,100 equivalent)
          mll_after_payout: "After the first payout the MLL moves to $100 (balance basis $0) and stays fixed permanently, regardless of where it was trailing. No buffer -> balance after payout can be close to the floor."
          dll: {amount_usd: 1000, kind: pause}   # only with add-on
          consistency_pct: null
          payout:
            cycle_requirement: "5 winning days with >= $150 net P&L each + >= $500 net profit since last payout (first: total net profit >= $500)"
            min_profit_to_request_usd: 500
            min_payout_usd: 500         # older article version: $250
            max_payout_per_cycle_usd: 2000   # reduced from $5,000 (older version / still quoted in payout overview text summaries)
            max_pct_of_profit: 50       # "up to 50% of total profits per payout"
            buffer_usd: 0
            split_pct: 80
            frequency: "each new cycle of 5 qualifying winning days"
          payouts_before_live: 5        # "Five consecutive approved payouts on the same account" (max sim payouts 5)
          lifetime_payout_cap_usd: 100000   # "total sim payout cap of $100,000" (practically 5 x $2,000)
          scaling_plan: "Sim funded by balance: $0-1,499 -> 1 mini/10 micros; $1,500-1,999 -> 2/20; $2,000+ -> 3/30"
          inactivity_days: 7
        account_limits:
          max_funded_accounts: 5        # general rule for 25K/50K sim funded (3 if any 100K/150K held)
          max_eval_accounts: 10
        strategy_restrictions: &mffu_restrictions
          max_loss_per_trade: null      # no explicit per-trade loss rule
          min_rr_or_profit_rules: null
          "min_hold_time / microscalping": "HFT not allowed. 'Slippage and Bracket Usage: Exploiting the absence of slippage and utilizing tight brackets to gain from favorable fills are not permitted.' No numeric hold-time rule found for sim."
          news_trading: allowed         # T1 news allowed on evals, Flex and Builder; PROHIBITED on Rapid and Pro sim funded (flat 2 min before/after)
          hedging_stacking: "\"MyFunded Futures prohibits hedging of any kind. Hedging is defined as a trader entering both buy and sell positions on the same underlying asset, at the same time\" (mini vs micro same underlying counts). Hedging through different unrelated assets permitted. 'Collaborating with others to execute identical or opposite strategies across unconnected accounts is prohibited.' No explicit ban on same-direction stacking across one's own accounts found."
          copy_trading: "own accounts: allowed per third-party (tradecovex); official text only forbids copying between different traders ('Traders are not permitted to copy trade one another') and shared devices"
          other:
            - "Positions auto-closed 4:10 PM ET; holiday half-days not auto-liquidated -> open position at close = breach."
            - "2% price-limit rule: no trading within 2% of CME price limit on sim funded and live."
            - "Cross-instrument: combining minis+micros to exceed contract limit can lead to breach."
            - "Orders: placing multiple limit orders at same price to manipulate fills prohibited; trading gapped/illiquid markets for isolated fills prohibited."
            - "Live post-breach: 21-day cooldown (no sim trading, no new evals/resets)."
    notes:
      - "Flex rule changes per official FAQ: payout cap per cycle reduced to $2,000 (previously $5,000); sim-funded contract limits reduced; DLL add-on introduced. Payout overview search snippet (third-party summary) still mentions $5,000 - outdated."
      - "Live (Flex): initial balance $2,000, min balance $156, EOD drawdown, no DLL, 3 mini/30 micro, 80/20, daily payouts."
      - "Pipback changelog also records the Flex 50K cap change $5,000 -> $2,000 (third-party)."
    unknowns:
      - "Whether Flex can still be purchased anywhere (not in site catalogue as of 2026-10-24) and its last price."
      - "Whether 'net profit $500' for first payout is total since start or above any threshold (article: 'at least $500 in total net profit at the time of the request')."

